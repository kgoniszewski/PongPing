name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core tests (Linux, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S Core -B build -G Ninja -DPONGPING_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: Core tests + Xcode build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          clang++ --version
      - name: Core tests (Apple Clang)
        run: |
          cmake -S Core -B build -DPONGPING_SANITIZE=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Same signing as the local install instructions: ad-hoc, sandboxed,
      # no hardened runtime.
      - name: Build app, framework and extension (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project PongPing.xcodeproj -scheme PongPing -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Audio unit tests (in-process offline render)
        run: |
          set -o pipefail
          xcodebuild -project PongPing.xcodeproj -scheme PongPingKit -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test | tee test.log | grep -E "error:|Test Case|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Check bundle layout
        run: |
          APP=DerivedData/Build/Products/Debug/PongPing.app
          test -d "$APP/Contents/Frameworks/PongPingKit.framework"
          test -d "$APP/Contents/PlugIns/PongPingExtension.appex"
          plutil -p "$APP/Contents/PlugIns/PongPingExtension.appex/Contents/Info.plist"
          otool -L "$APP/Contents/PlugIns/PongPingExtension.appex/Contents/MacOS/PongPingExtension"
          codesign -d --entitlements - "$APP"
      - name: App self-test (sandboxed, in-process hosting path)
        run: |
          APP=DerivedData/Build/Products/Debug/PongPing.app
          "$APP/Contents/MacOS/PongPing" --selftest
      - name: Install script (same command as on the Mac mini)
        run: |
          scripts/install.sh --test
          V=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:AudioComponents:0:version" \
            /Applications/PongPing.app/Contents/PlugIns/PongPingExtension.appex/Contents/Info.plist)
          echo "installed plugin version: $V"
          test "$V" -gt 65536
      - name: auval (informational)
        continue-on-error: true
        run: auval -v aumu Pnpg Pgpg | tail -20
      - name: Registry diagnostic (informational)
        continue-on-error: true
        run: |
          APP=DerivedData/Build/Products/Debug/PongPing.app
          "$APP/Contents/MacOS/PongPing" --selftest-registry
