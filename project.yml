# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is generated, not committed.
name: PongPing

options:
  bundleIdPrefix: com.pongping
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    PONGPING_BUNDLE_PREFIX: com.pongping
    # Audio Unit version (0x00010000 = 1.0.0). Hosts rescan a plugin only when it rises.
    PONGPING_AU_VERSION: "65536"
    # 1 = ask the host for MIDI 2.0 (Universal MIDI Packets).
    PONGPING_REQUEST_MIDI2: "0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_CXX_LANGUAGE_STANDARD: c++2b
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_WARN_FOUR_CHARACTER_CONSTANTS: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Set your team ID here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

targets:
  PongPingKit:
    type: framework
    platform: macOS
    sources:
      - path: Kit/Public
        headerVisibility: public
      - path: Kit/Sources
      - path: Core/src
      - path: Core/include
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PONGPING_BUNDLE_PREFIX).PongPingKit
        PRODUCT_NAME: PongPingKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Core/include
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) PONGPING_REQUEST_MIDI2=$(PONGPING_REQUEST_MIDI2)"
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/Frameworks"
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreMIDI.framework
    scheme:
      testTargets:
        - PongPingKitTests

  PongPingKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Kit/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PONGPING_BUNDLE_PREFIX).PongPingKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PongPingKit

  PongPingExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PONGPING_BUNDLE_PREFIX).PongPing.PongPingExtension
        PRODUCT_NAME: PongPingExtension
        INFOPLIST_FILE: Extension/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: PONGPING_AU_VERSION=$(PONGPING_AU_VERSION)
        CODE_SIGN_ENTITLEMENTS: Extension/PongPingExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # Frameworks are embedded once, in the app; the extension finds them there.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - target: PongPingKit
        embed: false

  PongPing:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PONGPING_BUNDLE_PREFIX).PongPing
        PRODUCT_NAME: PongPing
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PongPing.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - target: PongPingKit
        embed: true
      - target: PongPingExtension
        embed: true
    scheme:
      testTargets: []
